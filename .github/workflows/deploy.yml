name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4

      - name: Checkout CrossGL Translator source
        uses: actions/checkout@v4
        with:
          repository: CrossGL/CrossGL-Translator
          path: _external/CrossGL-Translator

      - name: Checkout Infrintia source
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: CrossGL/infrintia
          path: _external/infrintia

      - name: Remove incomplete optional checkouts
        run: |
          if [ ! -d _external/infrintia/app ]; then
            rm -rf _external/infrintia
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Install Python documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Doxygen XML
        run: make doxygen

      - name: Build Sphinx site
        run: make strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
