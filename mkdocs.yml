site_name: CrossGL Documentation
site_url: https://crossgl.github.io/crossgl-docs
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.ico
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: slate
    primary: indigo
    accent: red
  features:
    - header.autohide
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - content.code.copy

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

repo_url: https://github.com/CrossGL/
repo_name: CrossGL

extra_css:
  - stylesheets/extra.css

nav:
  - HOME: index.md
  - CROSSTL:
    - Overview: pages/crosstl/crosstl.md
    - Language Reference: pages/crosstl/language.md
    - API Reference: pages/crosstl/api_reference.md
    - Design: pages/crosstl/design.md
    - Contributing: pages/crosstl/contributing.md
  - CREDORA:
    - Overview: pages/credora/overview.md
    - Getting Started: pages/credora/getting-started.md
    - API Reference: pages/credora/api-reference.md
  - INFRINTIA:
    - Overview: pages/infrintia/overview.md
    - Getting Started: pages/infrintia/getting-started.md
    - API Reference: pages/infrintia/api-reference.md
    - SDK Guide: pages/infrintia/sdk.md
    - Hosting Guide: pages/infrintia/hosting.md
  - DYSON:
    - Overview: pages/dyson/overview.md
    - Getting Started: pages/dyson/getting-started.md
